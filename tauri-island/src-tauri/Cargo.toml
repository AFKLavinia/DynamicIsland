[package]
name = "tauri-island"
version = "0.2.0"
description = "A Modern Dynamic Island in Rust + Tauri"
authors = ["Alper"]
edition = "2024"

[[bin]]
name = "tauri-island"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# Windows: Win32 (oyun modu, medya tuslari) + WinRT GSMTC + Cihaz Konumu (Geolocation)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Devices_Geolocation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints"
] }

# Linux: MPRIS (D-Bus) uzerinden calan medya, kapak resmi ve kontroller
[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
