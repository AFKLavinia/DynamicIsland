<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Island</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="island" class="island bar">
    <!-- Kompakt Görünüm -->
    <div class="compact-content">
      <!-- 1. Müzik Varken Kompakt Görünüm -->
      <div id="compact-music-box" class="compact-subbox" style="display:none;">
        <div class="compact-left">
          <img id="compact-cover" class="compact-cover" alt="" />
          <span id="compact-title" class="compact-title"></span>
        </div>
        <div class="compact-weather">
          <span id="compact-weather-icon" style="display:inline-flex; align-items:center;"></span>
          <span id="compact-temp"></span>
        </div>
      </div>

      <!-- 2. Müzik Yokken Fare Ön İzlemesi: Hava Durumu Özeti -->
      <div id="compact-weather-box" class="compact-subbox" style="display:flex;">
        <div class="cws-left">
          <span id="cws-icon" style="display:inline-flex; align-items:center;"></span>
          <span id="cws-location" class="cws-location"></span>
        </div>
        <!-- Compact Seçenek 2: Günün Derece Aralığı (↑ max° · ↓ min°) -->
        <div id="cws-range" class="cws-range"></div>
        <!-- Option A: Canlı İkincil Telemetri Pili (Nem / Rüzgar) -->
        <div id="cws-telemetry" class="cws-telemetry"></div>
        <div class="cws-right">
          <span id="cws-desc" class="cws-desc"></span>
          <span id="cws-temp" class="cws-temp"></span>
        </div>
        <!-- Option A/B: Hızlı Spotify Başlatıcı Pili -->
        <button id="cws-quick-music" class="cws-quick-music-btn" onclick="openSpotify(event)" title="Spotify'ı Aç">
          <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.498 17.306c-.216.353-.674.468-1.026.253-2.812-1.718-6.351-2.106-10.521-1.152-.403.093-.807-.16-.899-.564-.092-.404.161-.807.564-.899 4.568-1.044 8.487-.601 11.628 1.336.353.216.469.674.254 1.026zm1.468-3.262c-.272.443-.852.584-1.295.312-3.22-1.979-8.129-2.55-11.938-1.393-.497.151-1.028-.135-1.179-.633-.151-.498.136-1.028.634-1.179 4.354-1.321 9.774-.683 13.466 1.597.443.273.585.853.312 1.296zm.126-3.4c-3.861-2.293-10.229-2.505-13.896-1.391-.593.18-1.222-.16-1.402-.753-.18-.593.16-1.222.753-1.402 4.218-1.28 11.248-1.036 15.688 1.6c.534.316.708 1.01.392 1.544-.316.534-1.01.708-1.544.392z"/></svg>
        </button>
      </div>
    </div>

    <!-- Genişletilmiş Görünüm -->
    <div class="expanded-content">
      <!-- Feature 1: Ambient Dynamic Glow -->
      <div id="expanded-ambient-glow" class="ambient-glow"></div>

      <div class="tabs-header">
        <div>
          <button class="tab-btn active" onclick="switchTab('music', this)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            Müzik
          </button>
          <button class="tab-btn" onclick="switchTab('weather', this)">
            <svg class="icon" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
            Hava Durumu
          </button>
        </div>
        <button class="tab-btn" onclick="openSettingsWindow()">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>

      <!-- Müzik Paneli -->
      <div id="tab-music" class="tab-body">
        <div class="music-panel">
          <div id="music-cover-wrapper" class="music-album-art" style="visibility:visible;">
            <img id="music-cover-img" style="width:100%; height:100%; border-radius:14px; object-fit:cover; display:none;" alt="" />
            <svg id="music-fallback-icon" class="icon" style="width:38px; height:38px; color:#5c5c5e; display:none;" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <div id="spotify-logo-icon" style="display:none; align-items:center; justify-content:center; cursor:pointer;" onclick="openSpotify()" title="Spotify'ı Aç">
              <svg viewBox="0 0 24 24" style="width:44px; height:44px; fill:#1db954;"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.498 17.306c-.216.353-.674.468-1.026.253-2.812-1.718-6.351-2.106-10.521-1.152-.403.093-.807-.16-.899-.564-.092-.404.161-.807.564-.899 4.568-1.044 8.487-.601 11.628 1.336.353.216.469.674.254 1.026zm1.468-3.262c-.272.443-.852.584-1.295.312-3.22-1.979-8.129-2.55-11.938-1.393-.497.151-1.028-.135-1.179-.633-.151-.498.136-1.028.634-1.179 4.354-1.321 9.774-.683 13.466 1.597.443.273.585.853.312 1.296zm.126-3.4c-3.861-2.293-10.229-2.505-13.896-1.391-.593.18-1.222-.16-1.402-.753-.18-.593.16-1.222.753-1.402 4.218-1.28 11.248-1.036 15.688 1.6c.534.316.708 1.01.392 1.544-.316.534-1.01.708-1.544.392z"/></svg>
            </div>
          </div>

          <div class="music-meta">
            <div class="music-header-row">
              <!-- Feature 3: Platform Source Badge -->
              <div id="music-source-badge" class="source-badge">
                <span id="source-badge-icon" style="display:inline-flex; align-items:center;"></span>
                <span id="source-badge-name">Medya</span>
              </div>
              <!-- Feature 5: Audio Spectrum / Visualizer (8 Bouncing Bars) -->
              <div id="music-visualizer" class="music-visualizer">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
            </div>

            <div id="music-title" class="music-title-text"></div>
            <div id="music-artist" class="music-artist-text"></div>

            <!-- Option B: Idle Hızlı Medya Başlatıcı Hub -->
            <div id="launcher-row" class="launcher-row" style="display:none;">
              <button class="launcher-btn spotify" onclick="openSpotify(event)" title="Spotify'ı Başlat">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.498 17.306c-.216.353-.674.468-1.026.253-2.812-1.718-6.351-2.106-10.521-1.152-.403.093-.807-.16-.899-.564-.092-.404.161-.807.564-.899 4.568-1.044 8.487-.601 11.628 1.336.353.216.469.674.254 1.026zm1.468-3.262c-.272.443-.852.584-1.295.312-3.22-1.979-8.129-2.55-11.938-1.393-.497.151-1.028-.135-1.179-.633-.151-.498.136-1.028.634-1.179 4.354-1.321 9.774-.683 13.466 1.597.443.273.585.853.312 1.296zm.126-3.4c-3.861-2.293-10.229-2.505-13.896-1.391-.593.18-1.222-.16-1.402-.753-.18-.593.16-1.222.753-1.402 4.218-1.28 11.248-1.036 15.688 1.6c.534.316.708 1.01.392 1.544-.316.534-1.01.708-1.544.392z"/></svg>
                <span>Spotify</span>
              </button>
              <button class="launcher-btn ytmusic" onclick="openWebMusic(event)" title="YouTube Music'i Başlat">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.5c-4.14 0-7.5-3.36-7.5-7.5S7.86 4.5 12 4.5s7.5 3.36 7.5 7.5-3.36 7.5-7.5 7.5zm-2.25-11.25l6 3.75-6 3.75v-7.5z"/></svg>
                <span>YT Music</span>
              </button>
            </div>

            <!-- Feature 4: Track Progress Bar -->
            <div id="track-progress-row" class="track-progress-row">
              <span id="track-time-cur" class="time-label">0:00</span>
              <div class="track-progress-bar">
                <div id="track-progress-fill" class="track-progress-fill"></div>
              </div>
              <span id="track-time-total" class="time-label">0:00</span>
            </div>

            <!-- Controls & Feature 2: Volume Slider -->
            <div class="music-bottom-row">
              <div id="music-ctrl-row" class="music-controls">
                <button class="ctrl-btn" onclick="apiPrev()">
                  <svg class="icon" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                </button>
                <button class="ctrl-btn play" onclick="apiPlayPause()">
                  <svg id="ico-play" class="icon" style="fill:currentColor;" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                  <svg id="ico-pause" class="icon" style="fill:currentColor; display:none;" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <button class="ctrl-btn" onclick="apiNext()">
                  <svg class="icon" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                </button>
              </div>

              <!-- iOS Tarzı Ses Kaydırıcı -->
              <div id="volume-row" class="volume-row">
                <button id="vol-mute-btn" class="vol-icon-btn" onclick="apiToggleMute()" title="Sesi Aç/Kapat">
                  <svg id="ico-vol-high" class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                  <svg id="ico-vol-mute" class="icon" style="display:none;" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                </button>
                <div id="vol-slider-track" class="vol-slider-track" onclick="handleVolClick(event)" title="Ses Düzeyi">
                  <div id="vol-slider-fill" class="vol-slider-fill"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Hava Durumu Paneli -->
      <div id="tab-weather" class="tab-body" style="display: none;">
        <div class="weather-panel">
          <div id="weather-icon-container" class="weather-icon-box"></div>
          <div class="weather-info-box">
            <div class="weather-city-label">
              <svg class="icon" style="width:12px; height:12px; flex-shrink:0;" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              <span id="weather-location"></span>
            </div>
            <div class="weather-temp-row">
              <div id="weather-temp" class="weather-temp"></div>
              <div id="weather-desc" class="weather-desc-badge"></div>
            </div>
            <div id="tel-1" class="weather-line"></div>
            <div id="tel-2" class="weather-line"></div>
            <div id="tel-3" class="weather-line"></div>
          </div>
          <div id="weather-forecast" class="forecast"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modüler JavaScript Mimarisi (Single Responsibility) -->
  <script src="island.js"></script>
  <script src="weather.js"></script>
  <script src="audio.js"></script>
  <script src="music.js"></script>
</body>
</html>
