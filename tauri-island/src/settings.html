<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Island Ayarları</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #141416;
      color: #ffffff;
      padding: 24px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .section {
      margin-bottom: 22px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      background: #242426;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0a84ff;
    }

    .btn {
      background: #0a84ff;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0071e3;
    }

    .info-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: #a1a1a6;
      line-height: 1.5;
    }

    .status-text {
      font-size: 12px;
      color: #30d158;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <svg style="width:20px; height:20px; stroke:#0a84ff; fill:none; stroke-width:2;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    <h2>Dynamic Island Ayarları</h2>
  </div>

  <div class="section">
    <div class="section-title">Konum & Hava Durumu</div>
    <div class="input-group">
      <input type="text" id="city-input" placeholder="Şehir veya ilçe adı (Örn: Kadıköy, İzmir, Ankara)">
      <button class="btn" onclick="saveCity()">Kaydet</button>
    </div>
    <div id="status-msg" class="status-text">✓ Konum başarıyla kaydedildi!</div>
  </div>

  <div class="section">
    <div class="section-title">Oyun Modu & Çekirdek Koruması</div>
    <div class="info-card">
      Windows Direct3D ve Shell bildirimleri otonom olarak dinlenmektedir. Tam ekran bir oyuna girildiğinde Dynamic Island otomatik olarak gizlenir.
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    async function loadCurrentCity() {
      try {
        const w = await invoke('get_weather');
        if (w.city) {
          document.getElementById('city-input').value = w.city;
        }
      } catch (e) {}
    }

    async function saveCity() {
      const city = document.getElementById('city-input').value.trim();
      if (city) {
        await invoke('set_city', { city });
        const msg = document.getElementById('status-msg');
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
      }
    }

    loadCurrentCity();
  </script>
</body>
</html>
